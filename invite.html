<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="invite_title">推广返佣</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .invite-hero {
            text-align: center; padding: 60px 0 40px;
        }
        .invite-hero h1 { font-size: 3rem; margin-bottom: 20px; background: var(--brand-gradient); -webkit-background-clip: text; color: transparent; }
        .invite-hero p { color: var(--text-muted); font-size: 1.2rem; }
        
        .link-box {
            background: rgba(26,43,60,0.05); border: 1px solid var(--border-light);
            padding: 20px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between;
            margin: 40px auto; max-width: 600px;
        }
        .link-box span { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--brand-accent); }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="orb orb-2" style="background: rgba(245,158,11,0.15);"></div>

    <nav>
        <div class="logo">GALAXY QUANT</div>
        <div class="nav-links">
            <a href="index.html" data-i18n="nav_home">首页</a>
            <a href="invite.html" class="active" data-i18n="nav_invite">推广返佣</a>
            <a href="goods.html" data-i18n="nav_goods">商城</a>
            <a href="tutorial.html" data-i18n="nav_tutorial">使用教程</a>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLang('zh')">中</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
            <a href="kzt.html" class="btn-primary" data-i18n="nav_console">控制台</a>
        </div>
    </nav>

    <div class="main-content" style="margin-left: 0; max-width: 100%; padding-top: 100px;">
        <div class="invite-hero">
            <h1 data-i18n="invite_title">推广返佣计划</h1>
            <p data-i18n="invite_desc">邀请好友加入银河量化，最高可享 60% 的服务费返佣。</p>
            
            <div class="link-box">
                <div>
                    <div style="font-size: 12px; color: var(--text-muted); text-align: left; margin-bottom: 5px;" data-i18n="invite_link_label">您的专属邀请链接</div>
                    <span>https://galaxyquantitative.com/reg?c=VIP888</span>
                </div>
                <button class="btn-primary" style="padding: 10px 20px;" data-i18n="invite_btn_copy">复制链接</button>
            </div>
        </div>

        <div style="max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div class="glass-panel" style="text-align: center;">
                <div style="color: var(--text-muted); margin-bottom: 10px;" data-i18n="invite_stat_invited">已邀请人数</div>
                <div style="font-size: 3rem; font-weight: 900; font-family: 'JetBrains Mono';">128</div>
            </div>
            <div class="glass-panel" style="text-align: center;">
                <div style="color: var(--text-muted); margin-bottom: 10px;" data-i18n="invite_stat_earned">累计赚取返佣</div>
                <div style="font-size: 3rem; font-weight: 900; font-family: 'JetBrains Mono'; color: var(--brand-accent);">4,500 U</div>
            </div>
        </div>
    </div>
    <script src="i18n.js"></script>
</body>
</html>
